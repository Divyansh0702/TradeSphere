spring.application.name=portfolio-pro-api
# server.port=${SERVER_PORT:8080}
server.port=${PORT:10000}
server.address=0.0.0.0

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.cors.allowed-origin=${FRONTEND_URL:tradesphere-div.vercel.app}